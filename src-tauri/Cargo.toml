[package]
name = "git-zen"
version = "0.1.0"
edition = "2021"

[lib]
name = "git_zen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2.5.9"
tauri-plugin-opener = "2.5.4"

[profile.release]
strip = true
lto = true
