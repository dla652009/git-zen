name: Release

# 打 tag 即发布：git tag v0.5.0 && git push --tags
# 自动完成：构建 → 用 updater 私钥签名 → 创建 Release → 上传安装包与 latest.json
#
# 需要两个仓库 Secret（Settings › Secrets and variables › Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          —— `pnpm tauri signer generate` 生成的私钥全文
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD —— 生成时设的密码（空密码就留空字符串）
# 没有这两个，构建出的包没有签名，updater 会拒绝安装（这是官方的强制校验）。

# 只认 tag 推送，**不提供 workflow_dispatch**。
# 原因：手动触发时 `github.ref_name` 是分支名（feature/0.1），而 tauri-action 会拿它
# 当 tagName 去建 Release —— 于是在本地留下一个与分支同名的 tag。
# 后果不只是垃圾：`git checkout feature/0.1` 会因同名 tag 报「refname is ambiguous」，
# 解析到错误的对象就可能把 HEAD 弄成游离状态。
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      # tauri-action 需要写 Release 的权限
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 自检放在构建前：类型错、契约不符、测试挂了就别发出去
      - name: 自检（契约 + 对比度 + 类型 + 单测 + 构建）
        run: pnpm verify

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Release 正文与 latest.json 的 notes 是同一份文本：tauri-action 会把 releaseBody
      # 原样写进 notes，所以这里取 docs/RELEASE-<版本>.md。
      # 版本号从 tag 里剥掉前缀 v（v0.5.1 → 0.5.1）。
      - name: 读取发布说明
        id: notes
        shell: bash
        run: |
          # 只由 tag 推送触发，GITHUB_REF_NAME 一定是 vX.Y.Z
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="docs/RELEASE-${VERSION}.md"
          # 只产出一份「纯文本 notes」：tauri-action 的 releaseBody 会被原样写进
          # latest.json 的 notes，而应用里的更新弹窗是纯文本展示 ——
          # 塞 markdown 会让用户看到一堆 ## 和 **，所以这里是剥过的版本。
          # （Release 网页也因此不带格式，只少一点加粗，可接受。）
          {
            echo "notes<<NOTES_EOF"
            if [ -f "$FILE" ]; then
              sed -E \
                -e 's/^#{1,6}[[:space:]]+//' \
                -e '/^[[:space:]]*```/d' \
                -e 's/\*\*([^*]+)\*\*/\1/g' \
                -e 's/`([^`]+)`/\1/g' \
                -e 's/^[[:space:]]*[-*][[:space:]]+/· /' \
                "$FILE" | cat -s
            else
              echo "本次更新没有附说明。"
              echo "::warning file=$FILE::找不到发布说明，Release 正文使用占位文案"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "git-zen ${{ github.ref_name }}"
          # 用纯文本版：tauri-action 把 releaseBody 原样写进 latest.json 的 notes，
          # 而应用里的更新弹窗是纯文本展示 —— 塞 markdown 会让用户看到一堆 ## 和 **。
          # Release 页面因此也不带格式（只少一点加粗，可接受）。
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          # tauri-action 会生成 latest.json 并一并上传，updater 的 endpoint 就指着它
          args: --bundles nsis
